# TOPAS with Qt visualization (Linux host, X11 or XWayland).
#
# Before the first run, on the host:   xhost +local:docker
# Interactive shell:                    docker compose run --rm topas
# Single simulation:                    docker compose run --rm topas topas MySim.txt
# When finished, on the host:           xhost -local:docker

services:
  topas:
    image: driegus/topas_4p3p0
    stdin_open: true          # keep STDIN open (docker run -i)
    tty: true                 # allocate a terminal (docker run -t)
    environment:
      - DISPLAY=${DISPLAY}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix
      - ./:/home/topas/WORKDIR      # current folder = your simulation folder
    working_dir: /home/topas/WORKDIR